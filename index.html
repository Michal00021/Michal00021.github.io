<!doctype html>
<html lang="pl">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
   name="description"
   content="Piękna strona dedykowana mojej dziewczynie."
  />
  <title>Dla mojej pięknej dziewczyny</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
   href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@400;700&display=swap"
   rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
 </head>

 <body>
  <!-- DATA -->
  <div id="datetime"></div>
  <div class="stars"></div>
  <!-- HERO -->
  <main class="hero">
   <div class="quote-container">
    <div class="quote" id="quote">
     <span class="quote-text">Dom to nie adres.<br />To Ty.</span>

     <button id="open-letter" class="letter-btn inside-quote">
      Otwórz list
     </button>
    </div>
   </div>

   <div class="info-container">
    <div class="counter" id="counter"></div>
    <div class="message" id="message"></div>
    <div class="love-note" id="love-note"></div>
    <div id="move-in-countdown" class="countdown-message"></div>
   </div>
  </main>

  <!-- LIST -->
  <div class="letter-overlay" id="letter-overlay">
   <div class="letter" id="letter">
    <p id="letter-text"><span id="cursor">|</span></p>
    <button id="close-letter" class="close-btn">Zamknij</button>
   </div>
  </div>

  <!-- AUDIO -->
  <audio id="paper-sound" preload="auto">
   <source src="paper.mp3" type="audio/mpeg" />
  </audio>

  <audio id="bg-music" loop>
   <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <button id="music-toggle" class="music-btn">🎵</button>

  <!-- JS -->
  <script src="script.js"></script>
 </body>
</html>
